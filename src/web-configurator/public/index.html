<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parameter Configurator 6.0 for Open Source Firmware TSDZ2 v20.1C.6 and TSDZ8</title>
<style>
 :root{--bg:#f2f4f7;--panel:#fff;--line:#c9d2dd;--head:#1d2733;--accent:#0d6efd}
 *{box-sizing:border-box}
 body{font-family:Tahoma,Verdana,Segoe UI,sans-serif;font-size:13px;background:var(--bg);margin:0;color:#1d2733}
 .banner{background:var(--head);color:#fff;padding:8px 14px;font-weight:bold;font-size:15px}
 .layout{display:flex;gap:14px;padding:14px;align-items:flex-start;flex-wrap:wrap}
 .left{flex:1 1 640px;min-width:600px}
 .sidebar{flex:0 0 270px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px;display:flex;flex-direction:column;gap:6px}
 .sidebar h3{margin:2px 0;font-size:12px;color:#5a6673}
 .verline{font-size:12px;color:#5a6673;word-break:break-all}
 select.list{width:100%;height:120px;font-size:12px}
 .tabs{display:flex;gap:2px;margin-bottom:0}
 .tabs button{padding:7px 16px;border:1px solid var(--line);border-bottom:none;background:#e7ecf2;cursor:pointer;font:inherit;border-radius:6px 6px 0 0}
 .tabs button.active{background:var(--panel);font-weight:bold}
 .tabpanes{background:var(--panel);border:1px solid var(--line);border-radius:0 6px 6px 6px;padding:12px}
 .pane{display:none}
 .pane.active{display:block}
 .groups{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start}
 .group{border:1px solid var(--line);border-radius:6px;padding:8px 10px 10px;flex:1 1 280px;min-width:260px}
 .group>h2{font-size:13px;margin:0 0 8px;padding-bottom:4px;border-bottom:1px solid var(--line)}
 .row{display:flex;align-items:center;gap:6px;margin:4px 0;min-height:26px}
 .row label{flex:1 1 auto}
 .row input[type=text]{width:72px;text-align:right;padding:3px 5px;font:inherit;border:1px solid var(--line);border-radius:4px}
 .row input:disabled{background:#eef1f5;color:#8a94a1}
 .row select{padding:3px 5px;font:inherit;border:1px solid var(--line);border-radius:4px;background:#fff}
 .row .chk{display:flex;align-items:center;gap:5px;flex:1}
 .radio-row{display:flex;align-items:center;gap:10px;margin:4px 0}
 .radio-row span{flex:1}
 .radio-row label{display:inline-flex;align-items:center;gap:3px;margin-left:2px;font-weight:normal}
 .hidden{display:none!important}
 .btn{padding:6px 10px;border:1px solid var(--line);border-radius:5px;background:#e7ecf2;cursor:pointer;font:inherit}
 .btn:hover{background:#dce4ee}
 .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:bold;padding:12px 10px}
 .btn.primary:disabled{background:#9aa7b5;border-color:#9aa7b5;cursor:not-allowed}
 .btn.small{padding:4px 8px;font-size:12px}
 #toasts{position:fixed;bottom:14px;right:14px;display:flex;flex-direction:column;gap:6px;z-index:50}
 .toast{background:#24303f;color:#fff;padding:9px 13px;border-radius:6px;max-width:340px;box-shadow:0 3px 10px rgba(0,0,0,.3)}
 .toast.error{background:#8c2f39}
 .unit{color:#5a6673;font-size:11px}
 .hint{color:#5a6673;font-size:11px;margin-top:6px}
 .adv-cols{display:flex;gap:12px;flex-wrap:wrap}
 .adv-cols .col{flex:1 1 200px;min-width:190px}
 .adv-cols .col h4{margin:4px 0;font-size:12px;color:#5a6673}
</style>
</head>
<body>
<div class="banner">TSDZ2/8 Parameter Configurator &mdash; web edition</div>

<div class="layout">
  <div class="left">
    <div class="tabs" id="tabs">
      <button data-tab="0" class="active">Basic settings</button>
      <button data-tab="1">Assistance settings</button>
      <button data-tab="2">Advanced settings</button>
    </div>
    <div class="tabpanes">
      <div class="pane active" id="pane0"></div>
      <div class="pane" id="pane1"></div>
      <div class="pane" id="pane2"></div>
    </div>
  </div>

  <div class="sidebar">
    <div class="verline" id="LB_VERSION">Version</div>
    <div class="verline" id="LB_LAST_COMMIT">Last commit</div>
    <hr>
    <h3>Experimental Settings</h3>
    <select class="list" id="expSet" size="8"></select>
    <button class="btn" id="BTN_COPY_FILE_INI">Copy from Experimental to Proven</button>
    <h3>Proven Settings</h3>
    <select class="list" id="provSet" size="7"></select>
    <div style="display:flex;gap:6px">
      <button class="btn small" id="BTN_IMPORT" title="Load a .ini file from disk into the editor">Import .ini</button>
      <button class="btn small" id="BTN_EXPORT" title="Save the current settings as a .ini file">Export .ini</button>
    </div>
    <input type="file" id="fileIni" accept=".ini,text/plain" class="hidden">
    <hr>
    <button class="btn primary" id="BTN_COMPILE">Compile firmware</button>
    <div class="hint">Compilation runs on the local server (sdcc + make).<br>
      Flashing is out of scope: use stm8flash / compile_and_flash_20.sh yourself.</div>
  </div>
</div>

<div id="toasts"></div>

  {id:'TF_ASSIST_THROTTLE_MIN', t:'text', l:'Throttle assist value min', def:'0', inline:{t:'text', id:'TF_ASSIST_THROTTLE_MAX', l:'max', def:'255'}},
  {id:'TF_MOTOR_BLOCK_TIME', t:'text', l:'Motor blocked error - threshold time', def:'10'},
  {id:'TF_MOTOR_BLOCK_CURR', t:'text', l:'Motor blocked error - threshold current', def:'30'},
  {id:'TF_MOTOR_BLOCK_ERPS', t:'text', l:'Motor blocked error - threshold ERPS', def:'20'},
]},
];

// ----- state ---------------------------------------------------------------
const S = {};        // field values: text -> string, check -> bool, combo -> index, radio group -> radio id
let intMaxSpeed=25, intStreetSpeed=25;
let intWalkSpeed1=35, intWalkSpeed2=40, intWalkSpeed3=45, intWalkSpeed4=50, intWalkSpeedLimit=60;
let intCruiseSpeed1=15, intCruiseSpeed2=18, intCruiseSpeed3=21, intCruiseSpeed4=24, intCruiseSpeed=10;
let intTorqueAdcStep=67;
let intTorqueOffsetAdj=MIDDLE_OFFSET_ADJ, intTorqueRangeAdj=MIDDLE_RANGE_ADJ, intTorqueAngleAdj=MIDDLE_ANGLE_ADJ;
let intThrottleMode=DISABLED, intThrottleModeOnStreetMode=DISABLED, intAssistLevel5=DISABLED;
let strLastCommit = '';

// radio group membership: radio id -> group field id
const RADIO_GROUP = {};
GROUPS.forEach(g => g.fields.forEach(f => {
  if (f.t === 'radio') f.radios.forEach(r => RADIO_GROUP[r.id] = f.id);
}));

const V = (id) => S[id];                 // text value
const C = (id) => !!S[id];               // checkbox
const IDX = (id) => S[id];               // combo index
const R = (id) => S[RADIO_GROUP[id]] === id; // radio selected
const setV = (id, v) => { S[id] = v; syncField(id); };
const setC = (id, b) => { S[id] = !!b; syncField(id); };
const setIdx = (id, i) => { S[id] = i; syncField(id); };
const setRadio = (radioId, on) => { if (on) { S[RADIO_GROUP[radioId]] = radioId; syncField(RADIO_GROUP[radioId]); } };

const UNITS = () => IDX('JCB_UNITS_TYPE');
const DISPLAY = () => IDX('JCB_DISPLAY_TYPE');
const MOTOR = () => IDX('JCB_MOTOR_TYPE');
const BRAKE = () => IDX('JCB_BRAKE_FEATURE');
const ADC = () => IDX('JCB_OPTIONAL_ADC');
const brakeOk = () => BRAKE() === BRAKE_SENSOR || BRAKE() === TEMPERATURE_SWITCH;
const throttleOk = () => ADC() === THROTTLE && brakeOk();

// ----- DOM ----------------------------------------------------------------
const el = (id) => document.getElementById(id);

function buildRow(f) {
  const row = document.createElement('div');
  row.className = 'row';
  if (f.t === 'text') {
    const lb = document.createElement('label'); lb.htmlFor = f.id; lb.textContent = f.l; lb.id = 'lb_' + f.id;
    const inp = document.createElement('input'); inp.type = 'text'; inp.id = f.id;
    row.append(lb, inp);
    if (f.inline) {
      const g = f.inline;
      if (g.t === 'check') {
        const w = document.createElement('span'); w.className = 'chk';
        const cb = document.createElement('input'); cb.type = 'checkbox'; cb.id = g.id;
        const cl = document.createElement('label'); cl.htmlFor = g.id; cl.textContent = g.l;
        w.append(cb, cl); row.append(w);
      } else {
        const gl = document.createElement('label'); gl.htmlFor = g.id; gl.textContent = g.l;
        const gi = document.createElement('input'); gi.type = 'text'; gi.id = g.id;
        row.append(gl, gi);
      }
    }
  } else if (f.t === 'check') {
    const w = document.createElement('span'); w.className = 'chk';
    const cb = document.createElement('input'); cb.type = 'checkbox'; cb.id = f.id;
    const cl = document.createElement('label'); cl.htmlFor = f.id; cl.textContent = f.l;
    w.append(cb, cl); row.append(w);
    if (f.extra) {
      const el2 = document.createElement('input'); el2.type = 'text'; el2.id = f.extra.id;
      el2.title = f.extra.label || '';
      const lb2 = document.createElement('span'); lb2.className = 'unit'; lb2.textContent = f.extra.label || '';
      if (f.extra.label) row.append(lb2);
      row.append(el2);
    }
  } else if (f.t === 'combo') {
    const lb = document.createElement('label'); lb.htmlFor = f.id; lb.textContent = f.l;
    const sel = document.createElement('select'); sel.id = f.id;
    f.opts.forEach((o, i) => { const op = document.createElement('option'); op.value = i; op.textContent = o; sel.append(op); });
    row.append(lb, sel);
    if (f.extra) {
      const lb2 = document.createElement('label'); lb2.htmlFor = f.extra.id; lb2.textContent = f.extra.label;
      const el2 = document.createElement('input'); el2.type = 'text'; el2.id = f.extra.id;
      row.append(lb2, el2);
    }
  } else if (f.t === 'radio') {
    row.classList.add('radio-row');
    const sp = document.createElement('span'); sp.textContent = f.l; sp.style.flex = '1';
    row.append(sp);
    f.radios.forEach(r => {
      const rb = document.createElement('input'); rb.type = 'radio'; rb.name = f.id; rb.id = r.id;
      const rl = document.createElement('label'); rl.htmlFor = r.id; rl.textContent = r.l;
      row.append(rb, rl);
    });
  }
  return row;
}

function buildUI() {
  GROUPS.forEach(g => {
    const pane = el('pane' + g.tab);
    let host = pane;
    const box = document.createElement('div');
    box.className = 'group' + (g.hiddenFields ? ' hidden' : '');
    if (g.title) { const h = document.createElement('h2'); h.textContent = g.title; if (g.unitLabel) { const u = document.createElement('span'); u.className='unit'; u.id = g.unitLabel; u.textContent = ' ' + g.unitText; h.append(u);} box.append(h); }
    if (g.advancedCols) {
      const cols = document.createElement('div'); cols.className = 'adv-cols';
      const c1 = document.createElement('div'); c1.className = 'col';
      const c2 = document.createElement('div'); c2.className = 'col';
      g.fields.forEach((f, i) => (i < 6 ? c1 : c2).append(buildRow(f)));
      cols.append(c1, c2); box.append(cols);
    } else {
      const wrap = document.createElement('div'); wrap.className = 'groups';
      const inner = document.createElement('div'); inner.style.width = '100%';
      g.fields.forEach(f => inner.append(buildRow(f)));
      wrap.append(inner); box.append(wrap);
    }
    pane.append(box);
  });

  // defaults
  GROUPS.forEach(g => g.fields.forEach(f => {
    if (f.t === 'radio') { S[f.id] = f.def; f.radios.forEach(r => S[r.id] = undefined); }
    else S[f.id] = f.def;
    if (f.inline) S[f.inline.id] = f.inline.def;
    if (f.extra) S[f.extra.id] = f.extra.def;
  }));
  syncAllFields();
}

function syncField(id) {
  const node = el(id);
  if (!node) return;
  if (node.type === 'checkbox') node.checked = !!S[id];
  else if (node.tagName === 'SELECT') node.value = String(S[id]);
  else if (node.type === 'radio') node.checked = R(id);
  else node.value = S[id];
}
function syncAllFields() { Object.keys(S).forEach(k => { if (S[k] !== undefined) syncField(k); }); }

function setEnabled(id, on) { const n = el(id); if (n) n.disabled = !on; }

// ----- dynamic labels (Java jLabelData*, jLabelLights*, jLabelMaxSpeed...) -
function dataLabel(n) {
  const id = 'TF_DATA_' + n, lb = el('lb_' + id);
  const t = V(id); const idx = parseInt(t, 10);
  lb.textContent = (idx >= 0 && idx <= 13 && String(idx) === String(t).trim()) ? `Data ${n} - ${displayDataArray[idx]}` : `Data ${n}`;
}
function lightLabel(which) {
  const map = { ON_START: [0, i => i >= 0 && i <= 8, 'Lights mode on startup'],
                1: [1, i => (i >= 0 && i <= 8) || i === 11, 'Mode 1'],
                2: [2, i => i >= 0 && i <= 9, 'Mode 2'],
                3: [3, i => (i >= 0 && i <= 8) || i === 10, 'Mode 3'] };
  const id = which === 'ON_START' ? 'TF_LIGHT_MODE_ON_START' : 'TF_LIGHT_MODE_' + which;
  const lb = el('lb_' + id);
  const idx = parseInt(V(id), 10);
  const ok = !isNaN(idx) && String(idx) === V(id).trim() && map[which][1](idx);
  lb.textContent = ok ? `${map[which][2]} - ${lightModeArray[idx].replace('<br>', '')}` : map[which][2];
}
function applyDynamicLabels() {
  for (let n = 1; n <= 6; n++) dataLabel(n);
  ['ON_START', '1', '2', '3'].forEach(lightLabel);
}

// Java speed KeyReleased handlers (5470-5656): store km/h-equivalent int
function speedIntUpdated(id) {
  const v = parseInt(V(id), 10);
  if (isNaN(v)) return;
  const store = UNITS() === KILOMETERS ? v : intDiv(v * 16, 10);
  switch (id) {
    case 'TF_MAX_SPEED': intMaxSpeed = store; break;
    case 'TF_STREET_SPEED_LIM': intStreetSpeed = store; break;
    case 'TF_WALK_ASS_SPEED_1': intWalkSpeed1 = store; break;
    case 'TF_WALK_ASS_SPEED_2': intWalkSpeed2 = store; break;
    case 'TF_WALK_ASS_SPEED_3': intWalkSpeed3 = store; break;
    case 'TF_WALK_ASS_SPEED_4': intWalkSpeed4 = store; break;
    case 'TF_WALK_ASS_SPEED_LIMIT': intWalkSpeedLimit = store; break;
    case 'TF_CRUISE_SPEED_ENA': intCruiseSpeed = store; break;
    case 'TF_CRUISE_ASS_1': intCruiseSpeed1 = store; break;
    case 'TF_CRUISE_ASS_2': intCruiseSpeed2 = store; break;
    case 'TF_CRUISE_ASS_3': intCruiseSpeed3 = store; break;
    case 'TF_CRUISE_ASS_4': intCruiseSpeed4 = store; break;
  }
}

// Java torque estimation (5685-5721, 6314)
function updateEstimatedStep() {
  if (!C('CB_ADC_STEP_ESTIM')) return;
  const off = parseInt(V('TF_TORQ_ADC_OFFSET'), 10);
  const max = parseInt(V('TF_TORQUE_ADC_MAX'), 10);
  const adv = parseInt(V('TF_TORQ_PER_ADC_STEP_ADV'), 10);
  if (isNaN(off) || isNaN(max) || isNaN(adv)) return;
  const onWeight = off + intDiv((max - off) * 75, 100);
  if (onWeight - off === 0) return;
  let calc = intDiv(WEIGHT_ON_PEDAL * 167, onWeight - off);
  calc = intDiv(calc * adv, DEFAULT_VALUE_ADC_STEP_ADV);
  setV('TF_TORQ_PER_ADC_STEP', String(calc));
}

// Java torque adjustment KeyReleased handlers (5658, 5723, 5750)
function torqueAdjUpdated(id, middle, isOffset) {
  const t = V(id);
  let sign = t.substring(0, 1), value;
  if (sign === '-') value = parseInt(t.substring(1), 10);
  else if (t === '') value = 0;
  else value = parseInt(t, 10);
  if (isNaN(value)) { setV(id, '0'); store(middle); return; }
  if (value >= 0 && value <= middle) {
    if (t === '') store(middle);
    else if (sign === '-') store(middle - value);
    else {
      let adj = middle + value;
      if (isOffset && adj > OFFSET_MAX_VALUE) {
        adj = OFFSET_MAX_VALUE;
        setV(id, String(OFFSET_MAX_VALUE - middle));
      }
      store(adj);
    }
  } else { setV(id, '0'); store(middle); }
  function store(v) {
    if (id === 'TF_TORQ_ADC_OFFSET_ADJ') intTorqueOffsetAdj = v;
    else if (id === 'TF_TORQ_ADC_RANGE_ADJ') intTorqueRangeAdj = v;
    else intTorqueAngleAdj = v;
  }
}

// Java JCB_DISPLAY_TYPEItemStateChanged value part (5979-6013)
function displayTypeChanged() {
  const d = DISPLAY();
  if (d === VLCD5 || d === VLCD6 || d === XH18) setIdx('JCB_ASSIST_LEVEL_5_MODE', DISABLED);
  else if (d === C850 || d === EKD01) setIdx('JCB_ASSIST_LEVEL_5_MODE', BEFORE_ECO);
  if (DISPLAY() === VLCD6 && UNITS() === MILES) setIdx('JCB_UNITS_TYPE', ALTERNATIVE_MILES);
  assistLevel5Changed();
  applyEnableRules();
}

// Java JCB_ASSIST_LEVEL_5_MODEItemStateChanged + load fixup (538, 6276)
function assistLevel5Changed() {
  const m = IDX('JCB_ASSIST_LEVEL_5_MODE');
  intAssistLevel5 = m;
  const p = parseInt(V('TF_ASS_LEVELS_5_PERCENT'), 10);
  if (m === BEFORE_ECO) { if (!isNaN(p) && p > 100) setV('TF_ASS_LEVELS_5_PERCENT', '60'); }
  else if (m === AFTER_TURBO) { if (!isNaN(p) && p < 100) setV('TF_ASS_LEVELS_5_PERCENT', '130'); }
}

// Java throttle gate inside JCB_OPTIONAL_ADC / JCB_BRAKE_FEATURE handlers (5816-5836, 5916-5936)
function throttleGate() {
  if (ADC() === THROTTLE && brakeOk()) return;
  setIdx('JCB_THROTTLE_MODE', DISABLED);
  setIdx('JCB_THROTTLE_MODE_STREET', DISABLED);
  if (ADC() === THROTTLE) setIdx('JCB_OPTIONAL_ADC', DISABLED);
}

// Java JCB_BRAKE_FEATUREItemStateChanged value part (5903-5907)
function brakeFeatureChanged() {
  if (BRAKE() === COASTER_BRAKE) {
    setC('CB_STARTUP_ASSIST_ENABLED', false);
    setC('CB_WALK_ASSIST_ENABLED', false);
    setC('CB_CRUISE_WHITOUT_PEDALING', false);
  }
  throttleGate();
  applyEnableRules();
}

// Java JCB_MOTOR_TYPEItemStateChanged (6231)
function motorTypeChanged() {
  if (MOTOR() === TSDZ8) {
    el('BTN_COMPILE').textContent = 'Compile HEX file';
    el('LB_VERSION').textContent = 'Version (mstrens)';
    el('LB_LAST_COMMIT').textContent = `Maim ${TSDZ8_HEADER[0]} - Sub ${TSDZ8_HEADER[1]}`;
    el('BTN_COMPILE').disabled = !boolTSDZ8headerRead;
  } else {
    el('BTN_COMPILE').textContent = 'Compile firmware';
    el('LB_VERSION').textContent = 'Version (last commits)';
    el('LB_LAST_COMMIT').textContent = strLastCommit || 'Last commit';
    el('BTN_COMPILE').disabled = false;
  }
  applyEnableRules();
}

// enable/disable cascade (union of all Java StateChanged handlers)
function applyEnableRules() {
  const walk = C('CB_WALK_ASSIST_ENABLED'), cruise = C('CB_CRUISE_ENABLED');
  const boost = C('CB_STARTUP_BOOST_ON_START'), cal = C('CB_TORQUE_CALIBRATION');
  const tempOk = ADC() === TEMPERATURE || MOTOR() === TSDZ8;

  setEnabled('TF_STREET_POWER_LIM', C('CB_STREET_POWER_LIM'));
  setEnabled('TF_ASS_WITHOUT_PED_THRES', C('CB_ASS_WITHOUT_PED'));
  setEnabled('CB_WALK_ASSIST_ENABLED', BRAKE() !== COASTER_BRAKE);
  ['TF_WALK_ASS_SPEED_1','TF_WALK_ASS_SPEED_2','TF_WALK_ASS_SPEED_3','TF_WALK_ASS_SPEED_4','TF_WALK_ASS_SPEED_LIMIT']
    .forEach(id => setEnabled(id, walk));
  setEnabled('CB_WALK_TIME_ENA', brakeOk() && walk);
  setEnabled('TF_WALK_ASS_TIME', brakeOk() && walk && C('CB_WALK_TIME_ENA'));
  setEnabled('CB_STREET_WALK', walk);
  setEnabled('TF_NUM_DATA_AUTO_DISPLAY', C('CB_AUTO_DISPLAY_DATA'));
  ['TF_LIGHT_MODE_ON_START','TF_LIGHT_MODE_1','TF_LIGHT_MODE_2','TF_LIGHT_MODE_3']
    .forEach(id => setEnabled(id, C('CB_LIGHTS')));
  setEnabled('TF_MAX_SPEED', !C('CB_MAX_SPEED_DISPLAY'));
  ['TF_TORQ_ADC_OFFSET','TF_TORQ_ADC_RANGE_ADJ','TF_TORQ_ADC_ANGLE_ADJ','TF_TORQUE_ADC_MAX','CB_ADC_STEP_ESTIM','TF_TORQ_PER_ADC_STEP_ADV','CB_TOR_SENSOR_ADV']
    .forEach(id => setEnabled(id, cal));
  setEnabled('TF_TORQ_PER_ADC_STEP', !C('CB_ADC_STEP_ESTIM'));
  ['TF_TEMP_MIN_LIM','TF_TEMP_MAX_LIM','CB_TEMP_ERR_MIN_LIM'].forEach(id => setEnabled(id, tempOk));
  setEnabled('JCB_TEMP_SENSOR_TYPE', ADC() === TEMPERATURE);
  ['TF_ADC_THROTTLE_MIN','TF_ADC_THROTTLE_MAX','TF_ASSIST_THROTTLE_MIN','TF_ASSIST_THROTTLE_MAX','JCB_THROTTLE_MODE','JCB_THROTTLE_MODE_STREET']
    .forEach(id => setEnabled(id, throttleOk()));
  setEnabled('TF_COASTER_BRAKE_THRESHOLD', BRAKE() === COASTER_BRAKE);
  setEnabled('CB_STARTUP_ASSIST_ENABLED', BRAKE() !== COASTER_BRAKE);
  setEnabled('CB_STARTUP_ASSIST_SPEED_LIMIT_ENABLED', C('CB_STARTUP_ASSIST_ENABLED'));
  setEnabled('CB_CRUISE_WHITOUT_PEDALING', brakeOk() && cruise);
  ['TF_CRUISE_ASS_1','TF_CRUISE_ASS_2','TF_CRUISE_ASS_3','TF_CRUISE_ASS_4','TF_CRUISE_SPEED_ENA','CB_STREET_CRUISE']
    .forEach(id => setEnabled(id, cruise));
  ['TF_BOOST_TORQUE_FACTOR','TF_BOOST_CADENCE_STEP','RB_BOOST_AT_ZERO_CADENCE','RB_BOOST_AT_ZERO_SPEED','RB_BOOST_AT_ZERO_AUTO']
    .forEach(id => setEnabled(id, boost));
  setEnabled('TF_SMOOTH_START_RAMP', C('CB_SMOOTH_START_ENABLED'));
  const six = DISPLAY() === VLCD5 || DISPLAY() === C850 || DISPLAY() === EKD01;
  ['TF_BAT_CELL_5_6','TF_BAT_CELL_4_6','TF_BAT_CELL_3_6','TF_BAT_CELL_2_6','TF_BAT_CELL_1_6']
    .forEach(id => setEnabled(id, six));
  ['TF_BAT_CELL_3_4','TF_BAT_CELL_2_4','TF_BAT_CELL_1_4']
    .forEach(id => setEnabled(id, !six));
  setEnabled('TF_ASS_LEVELS_5_PERCENT', IDX('JCB_ASSIST_LEVEL_5_MODE') !== DISABLED);
  setEnabled('TF_TORQUE_MODES_REF_VOLT', IDX('JCB_TORQUE_BASED') === BASED_ON_POWER);
}

// ----- change dispatch -----------------------------------------------------
function onUserChange(id) {
  const node = el(id);
  if (node.type === 'checkbox') S[id] = node.checked;
  else if (node.tagName === 'SELECT') S[id] = Number(node.value);
  else if (node.type === 'radio') S[RADIO_GROUP[id]] = id;
  else S[id] = node.value;

  switch (id) {
    case 'JCB_UNITS_TYPE': unitsChanged(); break;
    case 'JCB_DISPLAY_TYPE': displayTypeChanged(); break;
    case 'JCB_MOTOR_TYPE': motorTypeChanged(); break;
    case 'JCB_BRAKE_FEATURE': brakeFeatureChanged(); break;
    case 'JCB_OPTIONAL_ADC': throttleGate(); applyEnableRules(); break;
    case 'JCB_THROTTLE_MODE':
      if (IDX('JCB_THROTTLE_MODE') < IDX('JCB_THROTTLE_MODE_STREET')) setIdx('JCB_THROTTLE_MODE_STREET', IDX('JCB_THROTTLE_MODE'));
      break;
    case 'JCB_THROTTLE_MODE_STREET':
      if (IDX('JCB_THROTTLE_MODE_STREET') > IDX('JCB_THROTTLE_MODE')) setIdx('JCB_THROTTLE_MODE_STREET', IDX('JCB_THROTTLE_MODE'));
      break;
    case 'JCB_ASSIST_LEVEL_5_MODE': assistLevel5Changed(); applyEnableRules(); break;
    case 'JCB_TORQUE_BASED': applyEnableRules(); break;
    case 'CB_ADC_STEP_ESTIM':
      if (!C('CB_ADC_STEP_ESTIM')) setV('TF_TORQ_PER_ADC_STEP', String(intTorqueAdcStep));
      else updateEstimatedStep();
      applyEnableRules();
      break;
    case 'TF_TORQ_ADC_OFFSET': case 'TF_TORQUE_ADC_MAX': case 'TF_TORQ_PER_ADC_STEP_ADV':
      updateEstimatedStep(); break;
    case 'TF_TORQ_ADC_OFFSET_ADJ': torqueAdjUpdated(id, MIDDLE_OFFSET_ADJ, true); break;
    case 'TF_TORQ_ADC_RANGE_ADJ': torqueAdjUpdated(id, MIDDLE_RANGE_ADJ, false); break;
    case 'TF_TORQ_ADC_ANGLE_ADJ': torqueAdjUpdated(id, MIDDLE_ANGLE_ADJ, false); break;
    case 'TF_OVERCURRENT_DELAY': {
      const v = parseInt(V(id), 10);
      if (isNaN(v) || v < 0 || v > 5) setV(id, '2');
      break; }
    case 'TF_NUM_DATA_AUTO_DISPLAY': {
      const v = parseInt(V(id), 10);
      if (!isNaN(v) && v > 6) setV(id, '6');
      if (!isNaN(v) && v === 0) setV(id, '1');
      break; }
    case 'TF_ASS_LEVELS_5_PERCENT': {
      const v = parseInt(V(id), 10);
      if (IDX('JCB_ASSIST_LEVEL_5_MODE') === BEFORE_ECO && !isNaN(v) && v > 100) setV(id, '60');
      break; }
    default:
      if (id.startsWith('TF_MAX_SPEED') || id.startsWith('TF_STREET_SPEED') || id.startsWith('TF_WALK_ASS_SPEED') || id.startsWith('TF_CRUISE_')) speedIntUpdated(id);
  }
  if (id.startsWith('TF_DATA_')) dataLabel(Number(id.slice(-1)));
  if (id.startsWith('TF_LIGHT_MODE')) lightLabel(id === 'TF_LIGHT_MODE_ON_START' ? 'ON_START' : id.slice(-1));
  applyEnableRules();
}

function onBlurField(id) {
  // Java FocusLost handlers: eMTB minimum + assist level 5 percent floor
  if (/^TF_EMTB_ASS_[1-4]$/.test(id)) {
    const v = parseInt(V(id), 10);

// mirrors Java post-read fixups (455-705)
function applyLoadedFixups(fx) {
  if (!fx) {
    // partial load: just resync what we can
    setV('TF_TORQ_PER_ADC_STEP', String(intTorqueAdcStep));
    return;
  }

  // boost radio default (455)
  if (!fx.boostCad && !fx.boostSpeed && !fx.boostAuto) setRadio('RB_BOOST_AT_ZERO_CADENCE', true);
  else { setRadio('RB_BOOST_AT_ZERO_CADENCE', !!fx.boostCad); setRadio('RB_BOOST_AT_ZERO_SPEED', !!fx.boostSpeed); setRadio('RB_BOOST_AT_ZERO_AUTO', !!fx.boostAuto); }
  if (fx.RB_eMTB_POWER_v !== undefined) { setRadio('RB_eMTB_POWER', !!fx.RB_eMTB_POWER_v); setRadio('RB_eMTB_TORQUE', !!fx.RB_eMTB_TORQUE_v); }
  setRadio('RB_DISPLAY_WORK_ON', !!fx.workOn); setRadio('RB_DISPLAY_ALWAY_ON', !!fx.alwaysOn);

  setV('TF_TORQ_PER_ADC_STEP', String(intTorqueAdcStep)); // 458

  intTorqueOffsetAdj = fx.strTorqueOffsetAdj !== null && fx.strTorqueOffsetAdj !== undefined && !isNaN(parseInt(fx.strTorqueOffsetAdj, 10)) ? parseInt(fx.strTorqueOffsetAdj, 10) : MIDDLE_OFFSET_ADJ;
  intTorqueRangeAdj  = fx.strTorqueRangeAdj  !== null && fx.strTorqueRangeAdj  !== undefined && !isNaN(parseInt(fx.strTorqueRangeAdj, 10))  ? parseInt(fx.strTorqueRangeAdj, 10)  : MIDDLE_RANGE_ADJ;
  intTorqueAngleAdj  = fx.strTorqueAngleAdj  !== null && fx.strTorqueAngleAdj  !== undefined && !isNaN(parseInt(fx.strTorqueAngleAdj, 10))  ? parseInt(fx.strTorqueAngleAdj, 10)  : MIDDLE_ANGLE_ADJ;
  setAdjText('TF_TORQ_ADC_OFFSET_ADJ', intTorqueOffsetAdj, MIDDLE_OFFSET_ADJ);
  setAdjText('TF_TORQ_ADC_RANGE_ADJ', intTorqueRangeAdj, MIDDLE_RANGE_ADJ);
  setAdjText('TF_TORQ_ADC_ANGLE_ADJ', intTorqueAngleAdj, MIDDLE_ANGLE_ADJ);

  // assist mode combo (496-510)
  if (fx.boolAssistStartupPower) setIdx('JCB_ASSIST_MODE_ON_STARTUP', POWER);
  else if (fx.boolAssistStartupTorque) setIdx('JCB_ASSIST_MODE_ON_STARTUP', TORQUE);
  else if (fx.boolAssistStartupCadence) setIdx('JCB_ASSIST_MODE_ON_STARTUP', CADENCE);
  else if (fx.boolAssistStartupEmtb) setIdx('JCB_ASSIST_MODE_ON_STARTUP', EMTB);
  else if (fx.boolAssistStartupHybrid) setIdx('JCB_ASSIST_MODE_ON_STARTUP', HYBRID);

  // motor combo (512-520)
  if (fx.boolMotorTypeTSDZ2_48V) setIdx('JCB_MOTOR_TYPE', TSDZ2_48V);
  else if (fx.boolMotorTypeTSDZ2_36V) setIdx('JCB_MOTOR_TYPE', TSDZ2_36V);
  else if (fx.boolMotorTypeTSDZ8) setIdx('JCB_MOTOR_TYPE', TSDZ8);
  motorTypeChanged();

  // display combo (522-536) - handler fires: assist level 5 coercion etc.
  if (fx.boolDisplayTypeVLCD5) setIdx('JCB_DISPLAY_TYPE', VLCD5);
  else if (fx.boolDisplayTypeVLCD6) setIdx('JCB_DISPLAY_TYPE', VLCD6);
  else if (fx.boolDisplayTypeXH18) setIdx('JCB_DISPLAY_TYPE', XH18);
  else if (fx.boolDisplayType850C) setIdx('JCB_DISPLAY_TYPE', C850);
  else if (fx.boolDisplayTypeEKD01) setIdx('JCB_DISPLAY_TYPE', EKD01);
  displayTypeChanged();

  // assist level 5 (538-560)
  setIdx('JCB_ASSIST_LEVEL_5_MODE', intAssistLevel5);
  assistLevel5Changed();

  // data on startup / soc calc / temp sensor / torque based (562-596)
  if (fx.boolStartupNone) setIdx('JCB_DATA_ON_STARTUP', NONE);
  else if (fx.boolStartupSoc) setIdx('JCB_DATA_ON_STARTUP', SOC);
  else if (fx.boolStartupVolts) setIdx('JCB_DATA_ON_STARTUP', VOLTS);
  if (fx.boolSocAuto) setIdx('JCB_SOC_CALC', AUTO);
  else if (fx.boolSocWh) setIdx('JCB_SOC_CALC', WH);
  else if (fx.boolSocVolts) setIdx('JCB_SOC_CALC', VOLTS);
  setIdx('JCB_TEMP_SENSOR_TYPE', fx.boolTemperatureSensorType ? TMP36 : LM35);
  setIdx('JCB_TORQUE_BASED', fx.boolTorqueModesBasedOnPower ? BASED_ON_POWER : BASED_ON_CURRENT);

  // brake feature (598-610)
  if (fx.boolBrakeSensor) setIdx('JCB_BRAKE_FEATURE', BRAKE_SENSOR);
  else if (fx.boolCoasterBrake) setIdx('JCB_BRAKE_FEATURE', COASTER_BRAKE);
  else if (fx.boolTemperatureSwitch) setIdx('JCB_BRAKE_FEATURE', TEMPERATURE_SWITCH);
  else setIdx('JCB_BRAKE_FEATURE', DISABLED);
  brakeFeatureChanged();

  // optional ADC (612-620)
  if (fx.boolOptionalAdcDisabled) setIdx('JCB_OPTIONAL_ADC', DISABLED);
  else if (fx.boolOptionalAdcThrottle) setIdx('JCB_OPTIONAL_ADC', THROTTLE);
  else if (fx.boolOptionalAdcTemperature) setIdx('JCB_OPTIONAL_ADC', TEMPERATURE);
  throttleGate();

  setIdx('JCB_THROTTLE_MODE', intThrottleMode);
  setIdx('JCB_THROTTLE_MODE_STREET', intThrottleModeOnStreetMode);
  if (IDX('JCB_THROTTLE_MODE_STREET') > IDX('JCB_THROTTLE_MODE')) setIdx('JCB_THROTTLE_MODE_STREET', IDX('JCB_THROTTLE_MODE'));

  // eMTB legacy conversion (649-660)
  ['TF_EMTB_ASS_1','TF_EMTB_ASS_2','TF_EMTB_ASS_3','TF_EMTB_ASS_4'].forEach(id => {
    const v = parseInt(V(id), 10);
    if (!isNaN(v) && v < 21) setV(id, String(intDiv(v * 127, 10)));
  });

  // units labels + speed texts (662-704)
  const km = !!fx.boolUnitsKilometers;
  if (km) {
    el('lb_TF_MAX_SPEED').textContent = 'Max speed offroad mode (km/h)';
    el('lb_TF_STREET_SPEED_LIM').textContent = 'Street speed limit (km/h)';
    el('jLabelCruiseSpeedUnits').textContent = ' km/h';
    el('jLabelWalkSpeedUnits').textContent = ' km/h x10';
    setV('TF_MAX_SPEED', String(intMaxSpeed)); setV('TF_STREET_SPEED_LIM', String(intStreetSpeed));
    setV('TF_WALK_ASS_SPEED_1', String(intWalkSpeed1)); setV('TF_WALK_ASS_SPEED_2', String(intWalkSpeed2));
    setV('TF_WALK_ASS_SPEED_3', String(intWalkSpeed3)); setV('TF_WALK_ASS_SPEED_4', String(intWalkSpeed4));
    setV('TF_WALK_ASS_SPEED_LIMIT', String(intWalkSpeedLimit));
    setV('TF_CRUISE_SPEED_ENA', String(intCruiseSpeed));
    setV('TF_CRUISE_ASS_1', String(intCruiseSpeed1)); setV('TF_CRUISE_ASS_2', String(intCruiseSpeed2));
    setV('TF_CRUISE_ASS_3', String(intCruiseSpeed3)); setV('TF_CRUISE_ASS_4', String(intCruiseSpeed4));
    setIdx('JCB_UNITS_TYPE', KILOMETERS);
  } else {
    el('lb_TF_MAX_SPEED').textContent = 'Max speed offroad mode (mph)';
    el('lb_TF_STREET_SPEED_LIM').textContent = 'Street speed limit (mph)';
    el('jLabelCruiseSpeedUnits').textContent = ' mph';
    el('jLabelWalkSpeedUnits').textContent = ' mph x10';
    setV('TF_MAX_SPEED', String(intDiv(intMaxSpeed * 10 + 5, 16))); setV('TF_STREET_SPEED_LIM', String(intDiv(intStreetSpeed * 10 + 5, 16)));
    setV('TF_WALK_ASS_SPEED_1', String(intDiv(intWalkSpeed1 * 10 + 5, 16))); setV('TF_WALK_ASS_SPEED_2', String(intDiv(intWalkSpeed2 * 10 + 5, 16)));
    setV('TF_WALK_ASS_SPEED_3', String(intDiv(intWalkSpeed3 * 10 + 5, 16))); setV('TF_WALK_ASS_SPEED_4', String(intDiv(intWalkSpeed4 * 10 + 5, 16)));
    setV('TF_WALK_ASS_SPEED_LIMIT', String(intDiv(intWalkSpeedLimit * 10 + 5, 16)));
    setV('TF_CRUISE_SPEED_ENA', String(intDiv(intCruiseSpeed * 10 + 5, 16)));
    setV('TF_CRUISE_ASS_1', String(intDiv(intCruiseSpeed1 * 10 + 5, 16))); setV('TF_CRUISE_ASS_2', String(intDiv(intCruiseSpeed2 * 10 + 5, 16)));
    setV('TF_CRUISE_ASS_3', String(intDiv(intCruiseSpeed3 * 10 + 5, 16))); setV('TF_CRUISE_ASS_4', String(intDiv(intCruiseSpeed4 * 10 + 5, 16)));
  }
  if (fx.boolUnitsMiles) setIdx('JCB_UNITS_TYPE', MILES);
  else if (fx.boolAlternativeMiles) setIdx('JCB_UNITS_TYPE', ALTERNATIVE_MILES);
}
function setAdjText(id, val, middle) {
  if (val === middle) setV(id, '0');
  else if (val < middle) setV(id, '-' + (middle - val));
  else setV(id, String(val - middle));
}

  line(P('TF_BATT_PACK_RESISTANCE'));
  line(IDX('JCB_TORQUE_BASED') === BASED_ON_CURRENT ? 0 : 1);
  line(P('TF_TORQUE_MODES_REF_VOLT'));
  out.push(':00000001FF');
  return out.join('\n') + '\n';
}

// ----- settings library (localStorage) --------------------------------------
const LS_EXP = 'tsdz2web.experimental', LS_PROV = 'tsdz2web.proven', LS_LAST = 'tsdz2web.last';
let currentName = '';
let defaultsFiles = []; // [{name, ini}] from the server

const lsGet = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
const lsSet = (k, v) => localStorage.setItem(k, JSON.stringify(v));

function timestampName() {
  const d = new Date();
  const p = (n, w = 2) => String(n).padStart(w, '0');
  const off = -d.getTimezoneOffset();
  const sign = off >= 0 ? '+' : '-';
  const tz = sign + p(Math.floor(Math.abs(off) / 60)) + p(Math.abs(off) % 60);
  return `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}${tz}`;
}

function renderLists() {
  const exp = lsGet(LS_EXP, []);
  const expSel = el('expSet');
  expSel.innerHTML = '';
  exp.forEach(f => { const o = document.createElement('option'); o.textContent = f.name; o._ini = f.ini; expSel.append(o); });

  const provSel = el('provSet');
  provSel.innerHTML = '';
  const g1 = document.createElement('optgroup'); g1.label = 'Defaults (repository)';
  defaultsFiles.forEach(f => { const o = document.createElement('option'); o.textContent = f.name; o._ini = f.ini; g1.append(o); });
  const g2 = document.createElement('optgroup'); g2.label = 'Proven (this browser)';
  lsGet(LS_PROV, []).forEach(f => { const o = document.createElement('option'); o.textContent = f.name; o._ini = f.ini; g2.append(o); });
  provSel.append(g1, g2);
}

function saveExperimentalCopy() {
  const { ini } = generateOutputs();
  const name = timestampName() + '.ini';
  const exp = lsGet(LS_EXP, []);
  exp.unshift({ name, ini });
  lsSet(LS_EXP, exp.slice(0, 50));
  renderLists();
  return name;
}

// ----- compile --------------------------------------------------------------
async function compile() {
  const { ini, configH } = generateOutputs();
  const name = saveExperimentalCopy();
  lsSet(LS_LAST, { source: 'exp', name });

  if (MOTOR() === TSDZ8) {
    downloadFile('TSDZ8_config.hex', generateTsdz8Hex());
    toast('TSDZ8_config.hex generated (client-side, like the Java app)');
    return;
  }
  try {
    const r = await fetch('/api/compile', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: name.replace(/\.ini$/, ''), ini, configH }),
    });
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.statusText);
    const { guid } = await r.json();
    location.href = '/compile/' + guid;
  } catch (e) {
    toast('Compile request failed: ' + e.message, true);
  }
}

function downloadFile(name, text) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: 'application/octet-stream' }));
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

// ----- toasts ----------------------------------------------------------------
function toast(msg, isError) {
  const t = document.createElement('div');
  t.className = 'toast' + (isError ? ' error' : '');
  t.textContent = msg;
  el('toasts').append(t);
  setTimeout(() => t.remove(), isError ? 8000 : 4000);
}

// ----- wiring ----------------------------------------------------------------
function wire() {
  document.querySelectorAll('#tabs button').forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll('#tabs button').forEach(x => x.classList.remove('active'));
    document.querySelectorAll('.pane').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    el('pane' + b.dataset.tab).classList.add('active');
  }));

  // field events
  GROUPS.forEach(g => g.fields.forEach(f => {
    const ids = [f.id];
    if (f.inline) ids.push(f.inline.id);
    if (f.extra) ids.push(f.extra.id);
    if (f.t === 'radio') f.radios.forEach(r => ids.push(r.id));
    ids.forEach(id => {
      const n = el(id);
      if (!n) return;
      if (n.type === 'text') {
        n.addEventListener('input', () => onUserChange(id));
        n.addEventListener('change', () => { onUserChange(id); onBlurField(id); });
      } else {
        n.addEventListener('change', () => onUserChange(id));
      }
    });
  }));

  el('expSet').addEventListener('change', (e) => {
    const o = e.target.selectedOptions[0];
    if (o && o._ini) { loadIni(o._ini, o.textContent); lsSet(LS_LAST, { source: 'exp', name: o.textContent }); }
  });
  el('provSet').addEventListener('change', (e) => {
    const o = e.target.selectedOptions[0];
    if (o && o._ini) { loadIni(o._ini, o.textContent); lsSet(LS_LAST, { source: 'prov', name: o.textContent }); }
  });

  el('BTN_COPY_FILE_INI').addEventListener('click', () => {
    const o = el('expSet').selectedOptions[0];
    if (!o) { toast('Select a file in Experimental Settings first', true); return; }
    const suggested = el('provSet').selectedOptions[0]?.textContent || 'My_settings.ini';
    let name = prompt('New file name (.ini)', suggested);
    if (!name) return;
    if (!(name.length > 4 && name.slice(-4).toLowerCase() === '.ini')) name += '.ini';
    const prov = lsGet(LS_PROV, []);
    if (prov.some(f => f.name === name) || defaultsFiles.some(f => f.name === name)) {
      if (!confirm(name + ' file already exists, overwrite?')) return;
    }
    lsSet(LS_PROV, [{ name, ini: o._ini }, ...prov.filter(f => f.name !== name)]);
    renderLists();
  });

  el('BTN_IMPORT').addEventListener('click', () => el('fileIni').click());
  el('fileIni').addEventListener('change', async (e) => {
    const f = e.target.files[0];
    if (!f) return;
    loadIni(await f.text(), f.name);
    toast('Loaded ' + f.name);
    e.target.value = '';
  });
  el('BTN_EXPORT').addEventListener('click', () => {
    const { ini } = generateOutputs();
    downloadFile(currentName || timestampName() + '.ini', ini);
  });
  el('BTN_COMPILE').addEventListener('click', compile);
}

// ----- startup ---------------------------------------------------------------
async function init() {
  buildUI();
  wire();
  renderLists();

  try {
    const v = await (await fetch('/api/version')).json();
    strLastCommit = v.version || '';
    if (MOTOR() !== TSDZ8) el('LB_LAST_COMMIT').textContent = strLastCommit || 'Last commit';
  } catch { /* offline defaults */ }

  try {
    const d = await (await fetch('/api/defaults')).json();
    defaultsFiles = d.files || [];
    renderLists();
  } catch {
    toast('Could not load default settings from the server', true);
  }

  // auto-load last settings (mirrors Java lastSettingsFile), else 48V default
  const last = lsGet(LS_LAST, null);
  let loaded = false;
  if (last) {
    const pool = last.source === 'prov' ? [...defaultsFiles, ...lsGet(LS_PROV, [])] : lsGet(LS_EXP, []);
    const hit = pool.find(f => f.name === last.name);
    if (hit) { loadIni(hit.ini, hit.name); loaded = true; }
  }
  if (!loaded) {
    const def = defaultsFiles.find(f => /48V/i.test(f.name)) || defaultsFiles[0];
    if (def) loadIni(def.ini, def.name);
  }
  applyEnableRules();
  applyDynamicLabels();
}

init();
</script>
